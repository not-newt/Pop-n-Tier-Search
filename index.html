<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop'n Tier Search</title>
<style>
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: #252525; 
    color: #ffffff; 
    margin: 0; 
    padding: 20px; 
  }
  .container { 
    max-width: 1100px; 
    margin: auto; 
    background: #414141; 
    padding: 20px; 
    border-radius: 8px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
  }
  h1 { 
    text-align: center; 
    color: #0097a1;
  }
  .controls { 
    display: flex; 
    gap: 15px; 
    margin-bottom: 20px; 
    flex-wrap: wrap; 
    align-items: center;
  }
  input[type="text"], input[type="number"], select { 
    padding: 10px; 
    font-size: 16px; 
    border: 1px solid #ccc; 
    border-radius: 4px; 
    background-color: #fff;
    color: #333;
    box-sizing: border-box;
  }
  #searchInput { 
    flex: 2; 
    min-width: 200px; 
  }
  #levelFilter, #sortSelect { 
    flex: 1; 
    min-width: 150px; 
  }

  table { 
    width: 100%; 
    border-collapse: collapse; 
    margin-top: 10px; 
  }
  th, td { 
    padding: 12px; 
    text-align: left; 
    border-bottom: 1px solid #555; 
  }
  th { 
    background-color: #333; 
    color: white; 
    font-weight: bold;
  }
  tr:hover { background-color: #6e6e6e; }
  
  .tier-very-hard { color: #ff5252; font-weight: bold; }
  .tier-hard { color: #ffb74d; font-weight: bold; }      
  .tier-mid { color: #81c784; font-weight: bold; }       
  .tier-easy { color: #64b5f6; font-weight: bold; }      
  .tier-very-easy { color: #ba68c8; font-weight: bold; } 

  /* --- Mobile Responsive Table (Card View) --- */
  @media screen and (max-width: 768px) {
    .controls {
      flex-direction: column;
      align-items: stretch;
    }
    #searchInput, #levelFilter, #sortSelect {
      width: 100%;
      flex: none;
    }
    
    table, thead, tbody, th, td, tr { 
      display: block; 
    }
    
    /* Hide table headers on mobile */
    thead tr { 
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
    
    tr { 
      border: 1px solid #555; 
      background-color: #333;
      margin-bottom: 15px; 
      border-radius: 8px;
      overflow: hidden;
    }

    tr:hover { background-color: #333; }
    
    td { 
      border: none;
      border-bottom: 1px solid #444; 
      position: relative;
      padding-left: 50%;
      text-align: right;
    }
    
    td:last-child {
      border-bottom: none;
    }

    td::before { 
      content: attr(data-label);
      position: absolute;
      left: 12px;
      width: 45%; 
      white-space: nowrap;
      text-align: left;
      font-weight: bold;
      color: #aaa;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Pop'n Tier Search</h1>
  
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by Title, Genre, or Artist...">
    
    <select id="levelFilter">
      <option value="all">All Levels</option>
      <option value="50">Level 50</option>
      <option value="49">Level 49</option>
      <option value="48">Level 48</option>
      <option value="47">Level 47</option>
      <option value="46">Level 46</option>
      <option value="45">Level 45</option>
    </select>

    <select id="sortSelect">
      <option value="level-desc">Level (High to Low)</option>
      <option value="level-asc">Level (Low to High)</option>
      <option value="notes-desc">Total Notes (High to Low)</option>
      <option value="notes-asc">Total Notes (Low to High)</option>
    </select>
  </div>

  <table id="songTable">
    <thead>
      <tr>
        <th>Level</th>
        <th>Tier</th>
        <th>Title</th>
        <th>Genre</th>
        <th>Artist</th>
        <th>Total Notes</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      </tbody>
  </table>
</div>

<script>

  const tableBody = document.getElementById('tableBody');
  const searchInput = document.getElementById('searchInput');
  const levelFilter = document.getElementById('levelFilter');
  const sortSelect = document.getElementById('sortSelect');
  
  let songData = [];

  fetch('popn_level_tiers.json')
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      songData = data;
      renderTable(); 
    })
    .catch(error => {
      console.error('Failed to load tier data:', error);
      tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff5252;">Failed to load song data. Please ensure popn_level_tiers.json is available.</td></tr>`;
    });


  function getTierColorClass(tierValue) {
    if (tierValue >= 1.0) return "tier-very-hard";
    if (tierValue >= 0.4) return "tier-hard";
    if (tierValue >= 0.0) return "tier-mid";
    if (tierValue >= -0.4) return "tier-easy";
    return "tier-very-easy";
  }

  function renderTable() {
    if (!songData.length) return; 

    const query = searchInput.value.toLowerCase();
    const sortVal = sortSelect.value;
    const levelVal = levelFilter.value;

    let filtered = songData.filter(song => {
      const matchesSearch = song.title.toLowerCase().includes(query) || 
                            song.genre.toLowerCase().includes(query) ||
                            song.artist.toLowerCase().includes(query);
      const matchesLevel = levelVal === 'all' || song.level.toString() === levelVal;
      return matchesSearch && matchesLevel;
    });

    filtered.sort((a, b) => {
      if (sortVal === 'level-desc') return b.level - a.level || b.tier - a.tier;
      if (sortVal === 'level-asc') return a.level - b.level || a.tier - b.tier;
      if (sortVal === 'notes-desc') return b.notes - a.notes;
      if (sortVal === 'notes-asc') return a.notes - b.notes;
      return 0;
    });

    tableBody.innerHTML = '';
    filtered.forEach(song => {
      const displayTier = song.tier > 0 ? "+" + song.tier.toFixed(1) : song.tier.toFixed(1);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="Level"><strong>${song.level}</strong></td>
        <td data-label="Tier" class="${getTierColorClass(song.tier)}">${displayTier}</td>
        <td data-label="Title">${song.title}</td>
        <td data-label="Genre">${song.genre}</td>
        <td data-label="Artist">${song.artist}</td>
        <td data-label="Total Notes">${song.notes}</td>
      `;
      tableBody.appendChild(tr);
    });
  }

  searchInput.addEventListener('input', renderTable);
  levelFilter.addEventListener('change', renderTable);
  sortSelect.addEventListener('change', renderTable);

</script>
</body>
</html>
